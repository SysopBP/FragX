name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# The tag push creates the GitHub Release, which needs contents: write. Without this the
# default token is read-only and softprops/action-gh-release fails with HTTP 403.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      # All eight KMIs are needed before the APK can be assembled, so let every
      # job report rather than cancelling the siblings on the first failure.
      fail-fast: false
      matrix:
        include:
          - kmi: android12-5.10
            image: ghcr.io/ylarod/ddk-min@sha256:272ada1e61c525116032246df2a790d1ccec1804b7a9e0b09203c5e650dcb78e
          - kmi: android13-5.10
            image: ghcr.io/ylarod/ddk-min@sha256:e5ce038ba38408ad26aae1f2622cfb44dfbf6634b025bf197aa08beac0794f5b
          - kmi: android13-5.15
            image: ghcr.io/ylarod/ddk-min@sha256:9e68cd9fcab748584755d31ba88ef134efc938dbde17f258c2652315f6cd81cd
          - kmi: android14-5.15
            image: ghcr.io/ylarod/ddk-min@sha256:bbf697a8fe995704268eef710921c9d2ea4f146954690d7ea97887f3a4014a6a
          - kmi: android14-6.1
            image: ghcr.io/ylarod/ddk-min@sha256:1dd6ac340b627a90a4031d6d0df6b129d8cc949b139fb56032c898f023d3d5d3
          - kmi: android15-6.6
            image: ghcr.io/ylarod/ddk-min@sha256:51159bc935c75a282fc65bc87e02f16bd098d1cdf55dc558c4fdd0fcf7a132e2
          - kmi: android16-6.12
            image: ghcr.io/ylarod/ddk-min@sha256:fd3ec5cc71d7f2716212e9df8d5674a9afe68fb769282fcac87b83f207f949ee
          - kmi: android17-6.18
            image: ghcr.io/ylarod/ddk-min@sha256:fb8b66200bf402cf65a751060fc1aa29524b9fa8840feef16c7b196a4f3f0e6e
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # PR builds use a disposable development key. Distributable builds require
      # the permanent key and must match the recorded public certificate.
      - name: Provide a signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p app
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            keytool -genkeypair -keystore app/keystore.jks -alias dirtyfrag \
              -keyalg RSA -keysize 2048 -validity 30 \
              -storepass dirtyfrag -keypass dirtyfrag -dname "CN=FragX development"
            echo "FRAGX_KEYSTORE_PASSWORD=dirtyfrag" >> "$GITHUB_ENV"
            echo "FRAGX_KEY_ALIAS=dirtyfrag" >> "$GITHUB_ENV"
          else
            test -n "$KEYSTORE_B64" || { echo "::error::Set the permanent KEYSTORE secret before release builds."; exit 1; }
            test -n "$KEYSTORE_PASSWORD" || { echo "::error::Set KEYSTORE_PASSWORD before release builds."; exit 1; }
            printf '%s' "$KEYSTORE_B64" | base64 --decode > app/keystore.jks
            keytool -exportcert -keystore app/keystore.jks -alias dirtyfrag \
              -storepass:env KEYSTORE_PASSWORD -file "$RUNNER_TEMP/fragx-release.der"
            EXPECTED_CERT=$(cat provenance/signing-certificate.sha256)
            printf '%s  %s\n' "$EXPECTED_CERT" "$RUNNER_TEMP/fragx-release.der" | sha256sum --check
            printf 'FRAGX_KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FRAGX_KEY_ALIAS=dirtyfrag" >> "$GITHUB_ENV"
          fi

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - name: Prepare source and module provenance
        run: python3 tools/verify_release.py --prepare

      - uses: gradle/actions/setup-gradle@v6

      - name: Build DFRoot APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Record resolved Android runtime dependencies
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > DEPENDENCIES.txt

      - name: Verify packaged licenses and embedded modules
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/verify_release.py --apk app/build/outputs/apk/debug/fragx.apk
          else
            python3 tools/verify_release.py --apk app/build/outputs/apk/release/fragx.apk
          fi

      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # app/build.gradle.kts always writes app/build/outputs/apk/release/fragx.apk,
          # so the versioned asset name comes from the tag (v1.17-preview.1 -> FragX-v1.17-preview.1.apk).
          cp app/build/outputs/apk/release/fragx.apk "FragX-${GITHUB_REF_NAME}.apk"
          ls -l FragX-*.apk

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v7
        with:
          name: FragX
          # A pull request only produces the debug APK.
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/release/fragx.apk
            app/build/outputs/apk/debug/fragx.apk
            DEPENDENCIES.txt
            MODULE_BUILD.json
            THIRD_PARTY_NOTICES.txt
            FragX-source.tar.gz

      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Take just the section for this tag: v1.11 -> the "## 1.11" block.
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '/^## /{p = ($0 == "## " ver); next} p' CHANGELOG.md > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Exact source commit: $GITHUB_SHA. Source archive and build-record manifest are attached; dependency and license clearance remain under review." >> RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            FragX-*.apk
            DEPENDENCIES.txt
            MODULE_BUILD.json
            THIRD_PARTY_NOTICES.txt
            FragX-source.tar.gz
          body_path: RELEASE_NOTES.md
