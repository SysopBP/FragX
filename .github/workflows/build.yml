name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# The tag push creates the GitHub Release, which needs contents: write. Without this the
# default token is read-only and softprops/action-gh-release fails with HTTP 403.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      # All eight KMIs are needed before the APK can be assembled, so let every
      # job report rather than cancelling the siblings on the first failure.
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Both build types sign with app/keystore.jks, so the file has to exist on a
      # pull_request too - and on a fork with no KEYSTORE secret, where the missing
      # file used to fail the whole build at the signing task. A throwaway key is
      # better than no APK; it just cannot be installed over one signed with the
      # real key.
      - name: Provide a signing keystore
        run: |
          mkdir -p app
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/keystore.jks
          else
            echo "::warning::KEYSTORE secret is not set. Generating a throwaway key: the APK installs, but not over one signed with the real key."
            keytool -genkeypair -keystore app/keystore.jks -alias dirtyfrag \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dirtyfrag -keypass dirtyfrag -dname "CN=DirtyFrag"
          fi
          ls -l app/keystore.jks

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - name: Prepare source and module provenance
        run: python3 tools/verify_release.py --prepare

      - uses: gradle/actions/setup-gradle@v6

      - name: Build DFRoot APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Verify packaged licenses and embedded modules
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/verify_release.py --apk app/build/outputs/apk/debug/fragx.apk
          else
            python3 tools/verify_release.py --apk app/build/outputs/apk/release/fragx.apk
          fi

      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # app/build.gradle.kts always writes app/build/outputs/apk/release/fragx.apk,
          # so the versioned asset name comes from the tag (v1.11 -> DirtyFrag-v1.11.apk).
          cp app/build/outputs/apk/release/fragx.apk "FragX-${GITHUB_REF_NAME}.apk"
          ls -l FragX-*.apk

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v7
        with:
          name: FragX
          # A pull request only produces the debug APK.
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/release/fragx.apk
            app/build/outputs/apk/debug/fragx.apk
            MODULE_BUILD.json
            THIRD_PARTY_NOTICES.txt
            FragX-source.tar.gz

      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Take just the section for this tag: v1.11 -> the "## 1.11" block.
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '/^## /{p = ($0 == "## " ver); next} p' CHANGELOG.md > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Exact source commit: $GITHUB_SHA. Source archive and build-record manifest are attached; dependency and license clearance remain under review." >> RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            FragX-*.apk
            MODULE_BUILD.json
            THIRD_PARTY_NOTICES.txt
            FragX-source.tar.gz
          body_path: RELEASE_NOTES.md
