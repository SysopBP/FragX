android.useAndroidX=true

# Pin the build heap rather than inheriting a default: a CI runner has less RAM
# than a dev box, and the release build is the one that R8s.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true

# One R class, and non-final resource ids. Both shrink the release APK and are
# safe here because nothing looks a resource id up reflectively.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
